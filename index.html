<style>
:root{--ground:#E8EBEE;--card:#FFFFFF;--ink:#16202B;--muted:#6C7784;--hair:#D3D8DD;--petrol:#1F6F78;--petrol-soft:#E4EFF0;--flag:#8A3324;--flag-soft:#F6ECEA;--sans:'IBM Plex Sans',system-ui,-apple-system,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace}
html,body{margin:0;padding:0;background:var(--ground);-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
.ops-root{font-family:var(--sans);color:var(--ink);background:var(--ground);padding:20px 16px 32px;max-width:620px;margin:0 auto;line-height:1.45}
.ops-title{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0}
.ops-date{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--muted);margin-top:4px}
.head-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.toggles{display:flex;gap:6px}
.rule{background:var(--petrol-soft);border:1px solid var(--petrol);border-radius:3px;padding:12px 14px;margin-bottom:14px;font-size:14px;line-height:1.4}
.rule-k{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--petrol);margin-bottom:5px;font-weight:600}
.panel{background:var(--card);border:1px solid var(--hair);border-radius:3px;padding:4px 16px 6px;margin-bottom:10px}
.panel.danger{border-color:#E2CFCB}
.ptitle{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);font-weight:600;padding:12px 0 4px}
.ptitle span{font-weight:400;letter-spacing:.08em;color:var(--muted)}
.grow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--hair)}
.grow:last-child{border-bottom:none}
.gname{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);width:84px;flex-shrink:0}
.bname{font-size:13px;color:var(--muted);flex:1;line-height:1.3}
.gbar{flex:1;height:6px;background:var(--hair);border-radius:1px;overflow:hidden}
.gfill{height:100%;background:var(--petrol)}
.gfill.warn{background:var(--flag)}
.gval{font-family:var(--mono);font-size:11px;font-weight:600;width:64px;text-align:right;flex-shrink:0}
.gval.warn{color:var(--flag)}
.strip{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:2px 0 14px;border-bottom:1px solid var(--hair);margin-bottom:16px;flex-wrap:wrap}
.strip b{color:var(--ink);font-weight:600}
.strip b.low{color:var(--flag)}
.ops-card{background:var(--card);border:1px solid var(--hair);border-radius:3px;padding:16px;margin-bottom:10px}
.ops-card.alert{border-left:3px solid var(--flag)}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.eyebrow.flag{color:var(--flag)}
.prompt{font-size:17px;font-weight:500;margin:0 0 14px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
button{font-family:var(--sans);font-size:15px;font-weight:600;color:var(--ink);background:var(--card);border:1px solid var(--ink);border-radius:3px;padding:15px 18px;cursor:pointer;flex:1 1 130px;min-height:52px;transition:background .12s ease}
button:hover{background:var(--petrol-soft)}
button:focus-visible{outline:2px solid var(--petrol);outline-offset:2px}
button.primary{background:var(--ink);color:#fff}
button.primary:hover{background:var(--petrol);border-color:var(--petrol)}
button.quiet{border-color:var(--hair);color:var(--muted);font-weight:500}
.toggle{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;background:none;border:1px solid var(--hair);color:var(--muted);padding:5px 8px;min-height:0;flex:0 0 auto;font-weight:500;border-radius:2px}
.toggle.on{border-color:var(--petrol);color:var(--petrol);background:var(--petrol-soft)}
.option{display:flex;align-items:flex-start;gap:14px;width:100%;text-align:left;background:var(--card);border:1px solid var(--hair);border-radius:3px;padding:16px;margin-bottom:8px;font-size:16px;font-weight:400;min-height:0}
.option:hover{border-color:var(--petrol);background:var(--petrol-soft)}
.tag{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--petrol);border:1px solid var(--petrol);border-radius:2px;padding:1px 6px;flex-shrink:0;margin-top:2px}
.tag.sig{background:var(--petrol);color:#fff}
.focus-text{font-size:20px;font-weight:600;letter-spacing:-.01em;margin:0 0 4px}
.note{font-size:14px;color:var(--muted);margin:10px 0 0}
input[type=text],input[type=date]{font-family:var(--sans);font-size:16px;width:100%;padding:14px;border:1px solid var(--hair);border-radius:3px;margin-bottom:10px;color:var(--ink);background:#fff}
input:focus{outline:2px solid var(--petrol);outline-offset:-1px;border-color:var(--petrol)}
summary{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);cursor:pointer;padding:8px 0}
details{margin-top:6px}
.log-line{font-family:var(--mono);font-size:12px;color:var(--muted);padding:7px 0;border-bottom:1px solid var(--hair);display:flex;justify-content:space-between;gap:12px}
.log-line.used{text-decoration:line-through;opacity:.5}
.log-line b.no{color:var(--flag)}
.reset{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--muted);background:none;border:none;padding:12px 0;min-height:0;flex:0 0 auto;font-weight:400;text-decoration:underline;text-transform:uppercase}
.reset:hover{background:none;color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="ops-root" id="root"><div class="ops-card"><div class="eyebrow">Loading</div></div></div>
<script>
const P_HOME=[[1,'Be home when you said you would be. To the minute.'],[1,'Phone in another room for the first 15 minutes you are together.'],[1,'Sit with her for five minutes with nothing in your hands.'],[1,'Zero phone checks at dinner tonight.'],[1,'Give her the first hour after work, not the leftovers.'],[1,'Say yes to the next small thing she asks. No negotiating it.'],[1,'Laptop shut and away before she walks in.'],[2,'Phone off and in a drawer from 6pm until morning. Off, not silent.'],[2,'No laptop in the house tonight. Leave it in the car.'],[2,'Decline the evening call outright. Not rescheduled. Declined.'],[2,'Give her the whole of Saturday morning. Nothing booked around it.'],[2,'Take Thursday off. Drive her in, collect her, no conditions.'],[2,'End work at 5 today. Hard stop, no exceptions, tell no one it was hard.']];
const P_AWAY=[[1,'Call at the time you said. To the minute.'],[1,'Message when you land or finish, before she has to ask.'],[1,'Tell her what time you will call tomorrow. Then do it.'],[1,'Video call with nothing else open on your screen.'],[2,'Clear an evening on the road entirely. No calls, no dinner, just her.'],[2,'Move a meeting so you are free when she actually is.']];
const R_LIST=[[1,'Ask about something she told you last week. Use the detail, not the gist.'],[1,'Ask how the thing she was dreading actually turned out.'],[1,'Repeat back what she said before you respond. Once.'],[1,'Say one specific thing you noticed about her today. Out loud, once.'],[1,'Ask about a person she mentioned, by name.'],[1,'Ask what she wants this weekend, then do that thing.'],[2,'Whole conversation about her work. Zero solutions. Questions only, start to finish.'],[2,'Before you respond to any problem tonight, ask which she wants. Listen or help.'],[2,'Sit through the full story without reaching for the fix. Ask what she needs at the end.'],[2,'Ask what her hardest day this week will be, and what she wants from you on it.']];
const B_LIST=[[1,'Do not take a call from your ex while you are with her. Return it later.'],[1,'Tell her about a co-parenting decision before you make it, not after.'],[1,'Batch ex-related replies into one window today.'],[1,'Tell her what is happening with the ex before she has to ask.'],[1,'Do not let an ex-related issue become tonight\'s conversation.'],[2,'Say no to an ex-related request with her in the room. Let her see it happen.'],[2,'Set a contact window with your ex, tell her what it is, hold it all week.'],[2,'Bring her into the next co-parenting conversation that affects the household.'],[2,'Name one thing that is off limits to interruption, tell your ex, hold it.']];
const B_PABLO=[[1,'Ask her what she wants out of this week with Pablo. Before you plan it.'],[1,'Include her in one decision about Pablo before you decide it.'],[2,'Book one full evening this week that is only her, inside the Pablo week.'],[2,'Let her choose how the weekend with Pablo runs. Then run it that way.']];
const S_LIST=[[1,'Handle a bill or admin item she was dreading. Never raise it.'],[1,'Restock the thing she is running low on before she notices.'],[1,'Fix the thing that has been quietly annoying her. No announcement.'],[1,'Top up her car. Say nothing.'],[1,'Sort a Pablo logistics issue so it never lands on her at all.'],[1,'Clear your diary so you are free when she is. Do not tell her you moved anything.'],[1,'Deal with the ex thing early, out of her awareness, before you are with her.'],[1,'Charge her phone, warm the car, do the small invisible one.'],[1,'Do the chore she was going to do, before she gets to it.'],[2,'Take on something of hers for a whole week. She should never work out why it got easier.'],[2,'Cancel the thing you wanted to do so you are free on her hard day. Give no reason.'],[2,'Sort the admin backlog she has been avoiding. All of it. Mention none of it.']];
const RECOVER=['One question about her day. That is all.','Be home on time. Nothing else.','Phone away for ten minutes tonight.','Say one true specific sentence. Do not expand on it.','Make her a drink. Say nothing about yesterday.'];
const THU_PREP=[{c:'R',w:1,t:'Ask her what she needs tomorrow. Write the answer down.'},{c:'P',w:2,t:'Clear tomorrow evening completely. Tell her it is clear.'},{c:'P',w:2,t:'Offer the lift for tomorrow now, before she has to ask.'}];
const THU_DAY=[{c:'P',w:2,t:'Drive her in. Offered, not requested. No conditions. Talk on the way.'},{c:'R',w:1,t:'Message before the meeting with her boss. Specific, not generic.'},{c:'P',w:2,t:'Be free and unreachable to work at the end of her day.'}];

const RULES=[
 ['Before solving','She raises a problem. Ask which she wants, listening or help. Do not guess. The banking meltdown was not about banking.'],
 ['The ask is not the ask','When she asks for something concrete, ask yourself what kind of day is behind it. The lift was never about the lift.'],
 ['No unsolicited verdicts','On how she looks, what she is wearing, what she has chosen. Not asked for, not offered. Ever.'],
 ['Ex calls wait','Not in her presence, not on her time. Return it later. Every time, without needing to decide.'],
 ['Protected time is defended','Holidays, evenings, her day. If your ex pushes in, you hold the line, not her.'],
 ['Do not announce it','If you want to tell her what you did, it was partly for you. Silent gestures carry no debt and ask for nothing back.'],
 ['Withheld still counts','If you thought of something kind and did not do it, log it. The impulse was real. The brake is the thing to look at.']
];
const BREACH=[
 ['ex','Took an ex call, or let the ex into her time'],
 ['solve','Solved instead of listened'],
 ['verdict','Offered an opinion she did not ask for'],
 ['phone','Phone or work won during her time'],
 ['ask','She asked, I said no or made her negotiate']
];
const KEY='ops-state-v7';
const blank={today:null,lastAudit:null,recent:[],frictions:[],signals:[],asks:[],dropped:[],breaches:[],withheld:[],history:[],hardstop:'',stops:[],away:false,pablo:false};
let S={...blank},view='home',offered=[],heavy=false;
const el=document.getElementById('root');
const today=()=>new Date().toLocaleDateString('en-CA');
const dow=()=>new Date().getDay();
const esc=s=>String(s).replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
const daysAgo=n=>{const d=new Date();d.setDate(d.getDate()-n);return d.toLocaleDateString('en-CA');};
const gap=a=>Math.round((new Date(today())-new Date(a))/864e5);

const Store={
 async get(k){if(typeof window.storage!=='undefined'&&window.storage){try{return await window.storage.get(k,false);}catch(e){return null;}}
  const v=localStorage.getItem(k);return v===null?null:{key:k,value:v};},
 async set(k,v){if(typeof window.storage!=='undefined'&&window.storage){try{return await window.storage.set(k,v,false);}catch(e){}}
  localStorage.setItem(k,v);return{key:k,value:v};}};

async function load(){try{const r=await Store.get(KEY);if(r&&r.value)S={...blank,...JSON.parse(r.value)};}catch(e){}
 if(S.today&&S.today.date!==today())S.today=null;render();}
async function save(){try{await Store.set(KEY,JSON.stringify(S));}catch(e){console.error(e);}}

function recovering(){const h=S.history.find(x=>x.date===daysAgo(1));return h&&h.status==='missed';}
function lastServed(c){const h=S.history.filter(x=>x.status==='done'&&x.c===c);return h.length?gap(h[h.length-1].date):null;}
function lastBreach(k){const b=S.breaches.filter(x=>x.k===k);return b.length?gap(b[b.length-1].date):null;}
function breachCount(n){const c=daysAgo(n);return S.breaches.filter(b=>b.date>=c).length;}
function heavyThisWeek(){return S.history.filter(h=>h.date>=daysAgo(7)&&h.status==='done'&&h.w===2).length;}
function stopRate(){const w=S.stops.filter(s=>s.date>=daysAgo(14));return w.length?{h:w.filter(s=>s.held).length,n:w.length}:null;}

function pickThree(hv){
 if(recovering())return RECOVER.slice(0,3).map(t=>({c:'P',w:1,t:t}));
 if(dow()===3)return THU_PREP.slice();
 if(dow()===4)return THU_DAY.slice();
 const pool=arr=>{let p=arr.filter(x=>x[0]===(hv?2:1)&&!S.recent.includes(x[1]));
  if(!p.length)p=arr.filter(x=>x[0]===(hv?2:1));if(!p.length)p=arr;
  return{w:p[0][0],t:p[Math.floor(Math.random()*p.length)][1]};};
 const out=[];
 const od=S.dropped.filter(d=>!d.used);
 if(!hv&&od.length&&Math.random()<0.45){const d=od[od.length-1];out.push({c:'P',w:1,t:'She stopped asking for this. Offer it, on her terms: '+d.text,drop:d.text});}
 else{const x=pool(S.away?P_AWAY:P_HOME);out.push({c:'P',w:x.w,t:x.t});}
 const due=S.signals.filter(s=>!s.used&&(!s.resurface||s.resurface<=today()));
 if(!hv&&due.length&&Math.random()<0.75){const g=due[due.length-1];out.push({c:'R',w:1,t:'Bring this back to her: '+g.text,sig:g.text});}
 else{const x=pool(R_LIST);out.push({c:'R',w:x.w,t:x.t});}
 const x=pool(S.pablo?B_PABLO.concat(B_LIST):B_LIST);out.push({c:'B',w:x.w,t:x.t});
 const sd=lastServed('S');
 if(sd===null||sd>4){const y=pool(S_LIST);out.push({c:'S',w:y.w,t:y.t});}
 return out;
}
const CHEERS=['Set. Small and done beats big and discussed.','Locked. One thing, plainly.','Set. Nothing else needs to happen today.','Locked. Do it once. Do not add to it.'];

function servedRow(name,k){
 const d=lastServed(k),warn=d===null||d>7;
 const pct=d===null?0:Math.max(6,100-Math.min(d,14)/14*100);
 return '<div class="grow"><span class="gname">'+name+'</span><span class="gbar"><span class="gfill'+(warn?' warn':'')+'" style="width:'+pct+'%"></span></span><span class="gval'+(warn?' warn':'')+'">'+(d===null?'never':d===0?'today':d+'d')+'</span></div>';
}
function breachRow(k,label){
 const d=lastBreach(k),bad=d!==null&&d<7;
 return '<div class="grow"><span class="bname">'+label+'</span><span class="gval'+(bad?' warn':'')+'">'+(d===null?'clear':d===0?'today':d+'d ago')+'</span></div>';
}

function render(){
 const d=new Date().toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'});
 const a14=S.asks.filter(x=>x.date>=daysAgo(14)),yes=a14.filter(x=>x.answer==='yes').length;
 const isThu=dow()===4,isWed=dow()===3,rec=recovering(),hv=heavyThisWeek(),sr=stopRate();
 const rule=RULES[new Date().getDate()%RULES.length];
 let body='';

 if(view==='home'){
  let banner='';
  if(rec)banner='<div class="ops-card alert"><div class="eyebrow flag">Recovery day</div><p class="prompt" style="margin:0">Yesterday missed. Today goes smaller, not bigger. Do not overcorrect.</p></div>';
  else if(isWed)banner='<div class="ops-card alert"><div class="eyebrow flag">Wednesday</div><p class="prompt" style="margin:0">Tomorrow is the hard day. Tonight is prep, not recovery.</p></div>';
  else if(isThu)banner='<div class="ops-card alert"><div class="eyebrow flag">Thursday</div><p class="prompt" style="margin:0">Offer before she asks. The lift is not about the lift.</p></div>';

  const acts='<div class="btn-row" style="margin-top:8px"><button class="quiet" data-go="breach">Log a breach</button><button class="quiet" data-go="ask">Log an ask</button></div><div class="btn-row" style="margin-top:6px"><button class="quiet" data-go="withheld">Withheld</button><button class="quiet" data-go="signal">Signal</button></div><div class="btn-row" style="margin-top:6px"><button class="quiet" data-go="drop">Stopped asking</button></div>';

  if(S.today&&S.today.status==='set')
   body=banner+'<div class="ops-card"><div class="eyebrow">Active focus / '+S.today.c+'</div><p class="focus-text">'+esc(S.today.t)+'</p><p class="note">One thing. Adding more is overcompensating.</p></div><div class="btn-row"><button class="primary" data-go="audit">Audit tonight</button></div>'+acts;
  else if(S.today&&(S.today.status==='done'||S.today.status==='missed')){
   const dn=S.today.status==='done';
   body=banner+'<div class="ops-card"><div class="eyebrow">Closed</div><p class="focus-text">'+(dn?'Logged.':'Friction logged.')+'</p><p class="note">'+(dn?'Back tomorrow. Nothing more today.':'Tomorrow goes smaller.')+'</p></div>'+acts;
  }else
   body=banner+'<div class="ops-card"><div class="eyebrow">No focus set</div><p class="prompt">Pick today\'s single action.</p><div class="btn-row"><button class="primary" data-go="morning">Morning</button><button data-go="audit">Audit</button></div></div>'+acts;
 }

 if(view==='morning'){
  if(!offered.length)offered=pickThree(heavy);
  const fixed=isWed||isThu||rec;
  body='<div class="eyebrow" style="margin-left:2px">'+(rec?'Recovery set. Smallest available.':fixed?'Standing protocol':'Choose one')+'</div>'+
   offered.map((a,i)=>'<button class="option" data-pick="'+i+'"><span class="tag'+(a.sig||a.drop?' sig':'')+'">'+a.c+(a.w===2?'\u2009\u25cf':'')+'</span><span>'+esc(a.t)+'</span></button>').join('')+
   '<div class="btn-row"><button class="quiet" data-go="home">Back</button>'+(fixed?'':'<button class="quiet" data-reroll="1">Different three</button><button class="quiet" data-heavy="1">'+(heavy?'Go lighter':'Go heavier')+'</button>')+'</div>'+
   (heavy&&hv>=3?'<p class="note" style="padding:0 2px">Four or more heavy actions in a week is usually overcompensation, not progress.</p>':'');
 }
 if(view==='set')body='<div class="ops-card"><div class="eyebrow">Focus set / '+S.today.c+'</div><p class="focus-text">'+esc(S.today.t)+'</p><p class="note">'+esc(S.cheer||CHEERS[0])+'</p></div><div class="btn-row"><button class="quiet" data-go="home">Close</button></div>';
 if(view==='audit')body='<div class="ops-card"><div class="eyebrow">Audit</div><p class="prompt">Did you execute today\'s action?</p><div class="btn-row"><button class="primary" data-audit="yes">Yes</button><button data-audit="no">No</button></div></div>'+
  (S.hardstop?'<div class="ops-card"><div class="eyebrow">Hard stop, '+esc(S.hardstop)+'</div><p class="prompt">Did the phone and laptop go away on time?</p><div class="btn-row"><button data-stop="yes">Held</button><button data-stop="no">Did not</button></div></div>':'')+
  '<div class="btn-row"><button class="quiet" data-go="home">Back</button></div>';
 if(view==='friction')body='<div class="ops-card"><div class="eyebrow">Audit</div><p class="prompt">What was the friction point? Five words or less.</p><input type="text" id="inp" maxlength="60" placeholder="e.g. work ran over again"><div class="btn-row"><button class="primary" data-friction="1">Log and close</button></div></div>';
 if(view==='signal')body='<div class="ops-card"><div class="eyebrow">Signal</div><p class="prompt">Something she said or wanted.</p><input type="text" id="inp" maxlength="70" placeholder="e.g. dreading the review on the 8th"><p class="eyebrow" style="margin:4px 0 6px">Bring it back on</p><input type="date" id="rsf"><div class="btn-row"><button class="primary" data-signal="1">Save</button><button class="quiet" data-go="home">Back</button></div></div>';
 if(view==='drop')body='<div class="ops-card"><div class="eyebrow flag">Stopped asking</div><p class="prompt">Something she used to ask for and no longer does.</p><input type="text" id="inp" maxlength="70" placeholder="e.g. a bike ride at her tempo"><div class="btn-row"><button class="primary" data-drop="1">Save</button><button class="quiet" data-go="home">Back</button></div><p class="note">A withdrawn request is louder than a repeated one.</p></div>';
 if(view==='ask')body='<div class="ops-card"><div class="eyebrow flag">Direct ask</div><p class="prompt">What did she ask for?</p><input type="text" id="inp" maxlength="70" placeholder="e.g. lift to work in the rain"><p class="eyebrow" style="margin:4px 0 6px">What was it actually about</p><input type="text" id="inp2" maxlength="70" placeholder="e.g. Thursday, boss, needed me alongside her"><div class="btn-row"><button class="primary" data-ask="yes">I said yes</button><button data-ask="no">I said no</button></div><div class="btn-row" style="margin-top:8px"><button class="quiet" data-go="home">Back</button></div><p class="note">The second box is the one that matters. Saying yes to the wrong thing still misses her.</p></div>';
 if(view==='breach')body='<div class="ops-card"><div class="eyebrow flag">Breach</div><p class="prompt">What happened? Tap one. No explanation needed.</p>'+
  BREACH.map(b=>'<button class="option" data-breach="'+b[0]+'"><span>'+b[1]+'</span></button>').join('')+
  '<div class="btn-row"><button class="quiet" data-go="home">Back</button></div><p class="note">Log it and move on. No penance, no compensating action tomorrow.</p></div>';
 if(view==='withheld')body='<div class="ops-card"><div class="eyebrow flag">Withheld</div><p class="prompt">You thought of something and did not do it. What was it?</p><input type="text" id="inp" maxlength="70" placeholder="e.g. was going to bring her a coffee"><p class="eyebrow" style="margin:4px 0 6px">What stopped you</p><div class="btn-row"><button data-wh="transactional">Would look transactional</button><button data-wh="couldnt">Could not bring myself to</button><button data-wh="timing">Wrong moment</button><button data-wh="busy">Work, distracted</button></div><div class="btn-row" style="margin-top:8px"><button class="quiet" data-go="home">Back</button></div><p class="note">No judgement in this log. The impulse was there. This is a record of what happens between the impulse and her.</p></div>';
 if(view==='stopset')body='<div class="ops-card"><div class="eyebrow">Hard stop</div><p class="prompt">What time do the phone and laptop go away?</p><input type="text" id="inp" maxlength="12" placeholder="e.g. 7pm" value="'+esc(S.hardstop||'')+'"><div class="btn-row"><button class="primary" data-hardstop="1">Set</button><button class="quiet" data-go="home">Back</button></div><p class="note">One time, held nightly. Structural beats heroic.</p></div>';

 const openSig=S.signals.filter(s=>!s.used);
 const det=(t,n,rows)=>rows.length?'<details><summary>'+t+' ('+n+')</summary>'+rows.join('')+'</details>':'';
 const sigHtml=det('Recall queue',openSig.length+' open',S.signals.slice(-12).reverse().map(s=>'<div class="log-line'+(s.used?' used':'')+'"><span>'+esc(s.text)+'</span><span>'+esc((s.resurface||s.date).slice(5))+'</span></div>'));
 const dropHtml=det('Stopped asking',S.dropped.filter(x=>!x.used).length+' open',S.dropped.slice(-10).reverse().map(x=>'<div class="log-line'+(x.used?' used':'')+'"><span>'+esc(x.text)+'</span><span>'+esc(x.date.slice(5))+'</span></div>'));
 const askHtml=det('Ask log',yes+'/'+a14.length+' yes, 14d',S.asks.slice(-12).reverse().map(x=>'<div class="log-line"><span>'+esc(x.text)+(x.why?'<br><em style="opacity:.7">'+esc(x.why)+'</em>':'')+'</span><b class="'+(x.answer==='no'?'no':'')+'">'+x.answer.toUpperCase()+'</b></div>'));
 const whHtml=det('Withheld',S.withheld.filter(x=>x.date>=daysAgo(30)).length+' in 30d',S.withheld.slice(-12).reverse().map(x=>'<div class="log-line"><span>'+esc(x.text)+'</span><span>'+esc({transactional:'transactional',couldnt:'could not',timing:'timing',busy:'busy'}[x.why]||x.why)+'</span></div>'));
 const brHtml=det('Breach log',breachCount(30)+' in 30d',S.breaches.slice(-14).reverse().map(x=>{const l=BREACH.find(b=>b[0]===x.k);return '<div class="log-line"><span>'+esc(l?l[1]:x.k)+'</span><span>'+esc(x.date.slice(5))+'</span></div>';}));
 const frHtml=det('Friction log',S.frictions.length,S.frictions.slice(-8).reverse().map(f=>'<div class="log-line"><span>'+esc(f.text)+'</span><span>'+esc(f.date.slice(5))+'</span></div>'));

 el.innerHTML='<div class="head-row"><div><p class="ops-title">Daily Ops</p><div class="ops-date">'+d.toUpperCase()+'</div></div><div class="toggles"><button class="toggle'+(S.pablo?' on':'')+'" data-pablo="1">Pablo</button><button class="toggle'+(S.away?' on':'')+'" data-away="1">Away</button></div></div>'+
  '<div class="rule"><span class="rule-k">Standing rule / '+esc(rule[0])+'</span>'+esc(rule[1])+'</div>'+
  '<div class="panel"><div class="ptitle">Not done <span>days since served</span></div>'+servedRow('Presence','P')+servedRow('Recall','R')+servedRow('Boundary','B')+servedRow('Silent','S')+'</div>'+
  '<div class="panel danger"><div class="ptitle">Done <span>'+breachCount(30)+' breaches in 30 days</span></div>'+BREACH.map(b=>breachRow(b[0],b[1])).join('')+'</div>'+
  '<div class="strip"><span>Withheld 30d <b'+(S.withheld.filter(x=>x.date>=daysAgo(30)).length>4?' class="low"':'')+'>'+S.withheld.filter(x=>x.date>=daysAgo(30)).length+'</b></span><span>Asks <b'+(a14.length&&yes/a14.length<0.7?' class="low"':'')+'>'+yes+'/'+a14.length+'</b></span><span>Heavy 7d <b'+(hv>3?' class="low"':'')+'>'+hv+'</b></span><button class="toggle'+(S.hardstop?' on':'')+'" data-go="stopset">'+(S.hardstop?'Stop '+esc(S.hardstop)+(sr?' '+sr.h+'/'+sr.n:''):'Set hard stop')+'</button></div>'+
  body+brHtml+whHtml+askHtml+sigHtml+dropHtml+frHtml+'<div class="btn-row"><button class="reset" data-reset="1">Clear all data</button></div>';
 const i=document.getElementById('inp');if(i&&view!=='stopset')i.focus();
}

function closeDay(status,c,w){S.history=S.history.filter(h=>h.date!==today());S.history.push({date:today(),status:status,c:c||null,w:w||1});S.history=S.history.slice(-150);S.lastAudit=today();}

el.addEventListener('click',async e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.away){S.away=!S.away;render();return save();}
 if(b.dataset.pablo){S.pablo=!S.pablo;render();return save();}
 if(b.dataset.go){view=b.dataset.go;if(view==='morning'){offered=[];heavy=false;}return render();}
 if(b.dataset.reroll){offered=pickThree(heavy);return render();}
 if(b.dataset.heavy){heavy=!heavy;offered=pickThree(heavy);return render();}
 if(b.dataset.pick!==undefined){const a=offered[+b.dataset.pick];
  S.today={date:today(),c:a.c,w:a.w||1,t:a.t,status:'set',sig:a.sig||null,drop:a.drop||null};
  S.recent=[...S.recent,a.t].slice(-14);S.cheer=CHEERS[Math.floor(Math.random()*CHEERS.length)];
  view='set';render();return save();}
 if(b.dataset.audit==='yes'){
  if(S.today&&S.today.sig){const i=S.signals.findIndex(s=>s.text===S.today.sig);if(i>-1)S.signals[i].used=true;}
  if(S.today&&S.today.drop){const i=S.dropped.findIndex(s=>s.text===S.today.drop);if(i>-1)S.dropped[i].used=true;}
  closeDay('done',S.today?S.today.c:null,S.today?S.today.w:1);
  if(S.today)S.today.status='done';else S.today={date:today(),status:'done'};
  view=S.hardstop?'audit':'home';render();return save();}
 if(b.dataset.audit==='no'){view='friction';return render();}
 if(b.dataset.stop){S.stops=S.stops.filter(s=>s.date!==today());S.stops.push({date:today(),held:b.dataset.stop==='yes'});S.stops=S.stops.slice(-60);view='home';render();return save();}
 if(b.dataset.friction){const v=(document.getElementById('inp').value||'not recorded').trim();
  S.frictions.push({date:today(),text:v.slice(0,60)});
  closeDay('missed',S.today?S.today.c:null,S.today?S.today.w:1);
  if(S.today)S.today.status='missed';else S.today={date:today(),status:'missed'};
  view='home';render();return save();}
 if(b.dataset.signal){const v=(document.getElementById('inp').value||'').trim();if(!v){document.getElementById('inp').focus();return;}
  S.signals.push({date:today(),text:v.slice(0,70),resurface:document.getElementById('rsf').value||'',used:false});
  S.signals=S.signals.slice(-40);view='home';render();return save();}
 if(b.dataset.drop){const v=(document.getElementById('inp').value||'').trim();if(!v){document.getElementById('inp').focus();return;}
  S.dropped.push({date:today(),text:v.slice(0,70),used:false});S.dropped=S.dropped.slice(-25);
  view='home';render();return save();}
 if(b.dataset.ask){const v=(document.getElementById('inp').value||'unrecorded').trim();
  const w=(document.getElementById('inp2').value||'').trim();
  S.asks.push({date:today(),text:v.slice(0,70),why:w.slice(0,70),answer:b.dataset.ask});S.asks=S.asks.slice(-60);
  view='home';render();return save();}
 if(b.dataset.wh){const v=(document.getElementById('inp').value||'unrecorded').trim();
  S.withheld.push({date:today(),text:v.slice(0,70),why:b.dataset.wh});S.withheld=S.withheld.slice(-60);
  view='home';render();return save();}
 if(b.dataset.breach){S.breaches.push({date:today(),k:b.dataset.breach});S.breaches=S.breaches.slice(-80);
  view='home';render();return save();}
 if(b.dataset.hardstop){S.hardstop=(document.getElementById('inp').value||'').trim().slice(0,12);
  view='home';render();return save();}
 if(b.dataset.reset){S={...blank};view='home';render();return save();}
});
el.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='inp'){const b=el.querySelector('[data-friction],[data-signal],[data-drop],[data-hardstop]');if(b)b.click();}});
load();

</script>
</body>
</html>
